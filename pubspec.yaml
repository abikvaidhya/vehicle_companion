name: vehicle_companion
description: "Simple vehicle companion app to track your vehicle's health and maintenance, plan trips and other activities."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8 
  get: ^4.6.6

  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences:

  uuid: ^4.4.2
  intl: ^0.19.0
  collection: ^1.18.0
  
  permission_handler: ^11.3.1

  google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

